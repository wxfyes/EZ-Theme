<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>天阙 - 极速安全接入</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #060a14;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 硬件加速的赛博脉冲背景光圈 */
        .cyber-bg {
            position: absolute;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(34, 211, 238, 0.08) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate3d(-50%, -50%, 0);
            pointer-events: none;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate3d(-50%, -50%, 0) scale(0.85); opacity: 0.6; }
            100% { transform: translate3d(-50%, -50%, 0) scale(1.15); opacity: 1; }
        }

        /* 玻璃拟态科技卡片 */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 40px 32px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* 赛博雷达旋转 Spinner */
        .cyber-loader {
            position: relative;
            width: 70px;
            height: 70px;
            margin: 0 auto 24px;
        }

        .cyber-loader .spinner-ring {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #38bdf8;
            border-right-color: #818cf8;
            animation: spin 1s linear infinite;
        }

        .cyber-loader .spinner-core {
            position: absolute;
            top: 50%; left: 50%;
            width: 14px; height: 14px;
            background: #38bdf8;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px #38bdf8;
            animation: corePulse 1.2s ease-in-out infinite alternate;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes corePulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
        }

        .title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 13.5px;
            color: #94a3b8;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        /* 动态科技日志 */
        .node-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: monospace;
            font-size: 12px;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 6px 14px;
            border-radius: 12px;
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            margin-top: 24px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            border-radius: 2px;
            animation: loadFill 0.7s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
        }

        @keyframes loadFill {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- 赛博背景光轮 -->
    <div class="cyber-bg"></div>

    <!-- 跳转卡片 -->
    <div class="card">
        <div class="cyber-loader">
            <div class="spinner-ring"></div>
            <div class="spinner-core"></div>
        </div>

        <h2 class="title">⚡ 极速安全接入中...</h2>
        <p class="subtitle">正在为您自动匹配最快负载均衡节点<br>请稍候，即将进入后端面板</p>

        <div class="node-tag">
            <span style="width: 6px; height: 6px; border-radius: 50%; background: #38bdf8; display: inline-block;"></span>
            <span id="target-node-name">CONNECTING_NODE...</span>
        </div>

        <div class="progress-bar">
            <div class="fill"></div>
        </div>
    </div>

    <script>
        // 您的多个 Worker 账号地址池
        const workerNodes = [
            "https://tiao.tianque.cc/",
            "https://tiao.66621888.xyz",
            "https://tiao.zqwnan.tk/",
            "https://tz.126581.xyz/",
            "https://tiao.88855666.xyz/"
        ];

        // 随机选择一个入口，实现最原始的账号负载均衡
        const entry = workerNodes[Math.floor(Math.random() * workerNodes.length)];

        // 在页面展示挑选到的节点Host
        try {
            const hostName = new URL(entry).hostname;
            document.getElementById('target-node-name').innerText = "SELECTED: " + hostName;
        } catch(e) {
            document.getElementById('target-node-name').innerText = "MATCHED_SUCCESS";
        }

        // 给予 550ms 极速平滑动画过渡后，瞬间跳转！
        setTimeout(function() {
            window.location.href = entry;
        }, 550);
    </script>
</body>
</html>
